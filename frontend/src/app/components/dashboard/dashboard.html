<div class="dashboard-layout">
  <!-- Top Navbar -->
  <header class="navbar">
    <div class="brand">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">CampusPulse</span>
    </div>

    <div class="user-menu">
      <span class="user-name">Welcome, {{ currentUser()?.name || 'Student' }}</span>
      <button class="btn-logout" (click)="onLogout()">Logout</button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <section class="welcome-banner">
      <h1>Hello, {{ currentUser()?.name || 'Student' }}! 👋</h1>
      <p>Here is what's happening around campus today.</p>
    </section>

    <!-- Quick Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-icon">📚</span>
        <div class="stat-info">
          <h3>4</h3>
          <p>Active Courses</p>
        </div>
      </div>

      <div class="stat-card">
        <span class="stat-icon">📅</span>
        <div class="stat-info">
          <h3>2</h3>
          <p>Upcoming Events</p>
        </div>
      </div>

      <div class="stat-card">
        <span class="stat-icon">🔔</span>
        <div class="stat-info">
          <h3>3</h3>
          <p>New Notifications</p>
        </div>
      </div>
    </div>
  </main>
</div>
