<div class="register-container">
  <div class="register-card">
    <div class="brand-header">
      <span class="campus-badge">CampusPulse</span>
      <h2>Join the Campus 🚀</h2>
      <p class="subtitle">Create an account to get started with classes, events, and updates.</p>
    </div>

    @if (errorMessage()) {
      <div class="error-alert">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="name" 
          name="name" 
          placeholder="e.g. Alex Johnson"
          required 
        />
      </div>

      <div class="form-group">
        <label for="email">Student Email</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="e.g. alex@university.edu"
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••"
          required 
        />
      </div>

      <div class="form-group">
        <label for="password_confirmation">Confirm Password</label>
        <input 
          type="password" 
          id="password_confirmation" 
          [(ngModel)]="password_confirmation" 
          name="password_confirmation" 
          placeholder="••••••••"
          required 
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="footer-links">
      <p>Already have an account? <a routerLink="/login">Log in here</a></p>
    </div>
  </div>
</div>
